
---
- name: Deploy Website on All Slave Servers
  hosts: servers
  become: yes

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Copy Website
      ansible.builtin.copy:
        src: index.html
        dest: /var/www/html/index.html
        mode: '0644'

    - name: Start Nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: yes

